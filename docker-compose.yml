version: '3.8'

services:
  # Loki - Log aggregation system
  loki:
    image: grafana/loki:latest
    volumes:
      - loki-storage:/loki
    networks:
      - power-bot-network
    restart: unless-stopped

  # Power Bot - Main application (run from published image)
  power-bot:
    image: ghcr.io/konstantin-gavrin/dsiuhfsiofhiosehf:latest
    environment:
      - PORT=3000
      - THRESHOLD_EUR=0.10
      - CHECK_INTERVAL_MS=300000
      - ELERING_API_URL=https://dashboard.elering.ee/api/nps/price
    logging:
      driver: "loki"
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-batch-size: "400"
    depends_on:
      - loki
    networks:
      - power-bot-network
    restart: unless-stopped

networks:
  power-bot-network:
    driver: bridge
    name: power-bot-network
    external: true

volumes:
  loki-storage:
    driver: local
