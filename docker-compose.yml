version: '3.8'

services:
  # Loki - Log aggregation system
  loki:
    image: grafana/loki:latest
    volumes:
      - loki-storage:/loki
    networks:
      - power-bot-network
    restart: unless-stopped

  # Power Bot - Main application (run from published image)
  power-bot:
    image: ghcr.io/konstantin-gavrin/dsiuhfsiofhiosehf:latest
    environment:
      - PORT=3000
      - THRESHOLD_EUR=0.10
      - CHECK_INTERVAL_MS=300000
      - ELERING_API_URL=https://dashboard.elering.ee/api/nps/price
    depends_on:
      - loki
    networks:
      - power-bot-network
    restart: unless-stopped

  # Promtail - scrape container logs and push to Loki
  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ./grafana-provisioning/promtail:/opt/promtail-config:ro
    command: -config.file=/opt/promtail-config/promtail-config.yml -config.expand-env=true
    networks:
      - power-bot-network
    restart: unless-stopped

networks:
  power-bot-network:
    driver: bridge
    name: power-bot-network
    external: true

volumes:
  loki-storage:
    driver: local
