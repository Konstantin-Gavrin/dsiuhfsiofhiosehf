version: '3.8'

services:
  # Loki - Log aggregation system
  loki:
    image: grafana/loki:latest
    volumes:
      - loki-storage:/loki
    networks:
      - power-bot-network
    restart: unless-stopped

networks:
  power-bot-network:
    driver: bridge
    name: power-bot-network
    external: true

volumes:
  loki-storage:
    driver: local
