version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped

  power-bot:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - THRESHOLD_EUR=0.10
      - CHECK_INTERVAL_MS=300000
      - REQUEST_TIMEOUT_MS=10000
      - ALERT_HIGH_PRICE_EUR=0.25
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - ELERING_API_URL=https://dashboard.elering.ee/api/nps/price
      - LOKI_URL=http://loki-master:3100
    depends_on:
      - loki
    logging:
      driver: loki
      options:
        loki-url: "http://loki-master:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "5"
        labels: "service=power-bot,environment=production"
        tag: "{{.ImageName}}"
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - loki-storage:/loki
      - ./loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      - LOKI_URL=http://loki-master:3100
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ./grafana-provisioning/promtail:/opt/promtail-config:ro
    command: -config.file=/opt/promtail-config/promtail-config.yml -config.expand-env=true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - power-bot-network
    restart: unless-stopped

networks:
  default:
    driver: bridge

volumes:
  loki-storage:
    driver: local
  prometheus-storage:
    driver: local
  grafana-storage:
    driver: local
