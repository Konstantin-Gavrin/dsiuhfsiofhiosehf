version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped

  power-bot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - THRESHOLD_EUR=0.10
      - CHECK_INTERVAL_MS=300000
      - ELERING_API_URL=https://dashboard.elering.ee/api/nps/price
    depends_on:
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    volumes:
      - loki-storage:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ./grafana-provisioning/promtail:/opt/promtail-config:ro
    command: -config.file=/opt/promtail-config/promtail-config.yml -config.expand-env=true
    restart: unless-stopped

networks:
  default:
    driver: bridge

volumes:
  loki-storage:
    driver: local
