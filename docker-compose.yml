version: '3.8'

services:
  # Loki - Log aggregation system
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-storage:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - power-bot-network
    restart: unless-stopped

networks:
  power-bot-network:
    driver: bridge
    name: power-bot-network

volumes:
  loki-storage:
    driver: local
